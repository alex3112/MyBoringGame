name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Verify build counter
        shell: pwsh
        env:
          BEFORE: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          function Read-BuildNumber([string]$revision) {
            $value = (git show "${revision}:BUILD_NUMBER" | Out-String).Trim()
            if ($LASTEXITCODE -ne 0) { throw "Cannot read BUILD_NUMBER at $revision" }
            $number = [uint64]0
            if (-not [uint64]::TryParse($value, [ref]$number) -or $number -eq 0 -or $value -cne $number.ToString()) {
              throw "Invalid BUILD_NUMBER at $revision"
            }
            return $number
          }
          $base = if ($env:GITHUB_EVENT_NAME -eq 'pull_request') { $env:BASE_SHA } else { $env:BEFORE }
          $head = if ($env:GITHUB_EVENT_NAME -eq 'pull_request') { $env:HEAD_SHA } else { $env:GITHUB_SHA }
          $current = Read-BuildNumber $head
          if ($base -and $base.Trim('0').Length -ne 0) {
            $paths = @(git ls-tree --name-only $base -- BUILD_NUMBER)
            if ($LASTEXITCODE -ne 0) { throw 'Cannot inspect previous build' }
            if ($paths -contains 'BUILD_NUMBER') {
              $previous = Read-BuildNumber $base
              if ($current -ne ($previous + 1)) {
                throw "BUILD_NUMBER must increase by exactly one: $previous -> $current"
              }
            } elseif ($current -ne 125) {
              throw 'Initial BUILD_NUMBER must be 125'
            }
          }
      # The version and components pinned in rust-toolchain.toml.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Clippy, diagnostics build
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      # Includes xtask's repository_passes_policy, the asset-policy check.
      - name: Tests
        run: cargo test --workspace --locked
